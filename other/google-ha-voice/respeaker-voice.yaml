# =============================================================================
# reSpeaker XVF3800 + XIAO ESP32S3 — Home Assistant voice satellite + speaker
#
# Put secrets.yaml next to this file (or in your ESPHome config root).
# Gives you: micro wake word, HA voice pipeline, and a media_player entity
# that Music Assistant / tts.speak / media_player.play_media can target.
# =============================================================================

substitutions:
  name: kitchen-voice-1
  friendly_name: Kitchen Voice

  # Pin this to a tag/commit once you're happy, instead of "main".
  respeaker_ref: main

  # Optional tuning
  log_level: INFO
  hidden_ssid: "false"

packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml            # ESP32-S3, PSRAM, I2C, external components
      - packages/hardware.yaml        # I2S in/out, AIC3104 codec, XMOS DSP + DFU
      - packages/voice-assistant.yaml # mWW, VA pipeline, media_player + mixer
      - packages/leds.yaml            # 12-LED ring animations
      - packages/timers-alarm.yaml    # timers / alarms

# Remote packages can't read secrets, so credentials live here.
wifi:
  id: wifi_id
  fast_connect: ${hidden_ssid}
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # Reduced from the 20.5dB default. Signal measures -55 to -66 dBm at this
  # setting, which is healthy. Range is 8.5dB-20.5dB if it needs raising.
  output_power: 8.5dB
  reboot_timeout: 10min
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

api:
  encryption:
    key: !secret kitchen_api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# --- Daily 05:00 restart ------------------------------------------------------
# A issue for this has been raised here: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration/issues/58
# Mitigation, not a fix. The largest contiguous free block on the internal heap
# drifts down with uptime (~78 KB fresh, ~49 KB after 2.6 days). Playback then
# subtracts a roughly fixed amount, so a long uptime means playback crosses the
# threshold where the voice assistant can no longer arm — and the audio starts
# breaking up too. A restart resets the baseline.
#
# Extends the time component from packages/timers-alarm.yaml, which already has
# an on_time entry driving the alarm check. Lists append when packages merge, so
# both should run — verify by setting a short timer after flashing. Don't set a
# device alarm for 05:00; timers do not survive a restart.

time:
  - id: !extend homeassistant_time
    on_time:
      - hours: 5
        minutes: 0
        seconds: 0
        then:
          - button.press: restart_button

# --- Opportunistic restart when idle and short on contiguous heap -------------
# Checks every 10 minutes and restarts only when ALL of these hold:
#   * largest contiguous free block has drifted below 55 KB
#     (~78-106 KB fresh, ~49 KB after 2.6 days; playback fails below ~43 KB)
#   * device has been up over an hour, so it can never boot-loop
#   * no timer pending (next_timer is -1 when none; NaN also blocks it)
#   * media player idle - nothing playing or announcing
#   * no voice pipeline running
#
# Firing leaves the heap high again, so it will not immediately re-trigger.
# Alarms are restore_value and survive a restart; timers do not, hence the guard.

interval:
  - interval: 10min
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(heap_max_block).state < 55000;'
              - lambda: 'return id(device_uptime).state > 3600;'
              - lambda: 'return id(next_timer).state < 0;'
              - media_player.is_idle:
                  id: external_media_player
              - not:
                  voice_assistant.is_running:
          then:
            - logger.log:
                level: WARN
                format: "Idle, largest free block down to %.0f B - restarting"
                args: ['id(heap_max_block).state']
            - button.press: restart_button

# --- Move audio task stacks into PSRAM ---------------------------------------
# The mixer and both resampler speakers each run a FreeRTOS audio task whose
# stack defaults to internal RAM. No measurable effect on the internal-heap drop
# during playback, but harmless and boot numbers are normal, so left in place.
# ESP-IDF only.

speaker:
  - id: !extend mixing_speaker
    task_stack_in_psram: true
  - id: !extend announcement_resampling_speaker
    task_stack_in_psram: true
  - id: !extend media_resampling_speaker
    task_stack_in_psram: true

# --- Diagnostics -------------------------------------------------------------
# Reset Reason distinguishes Brownout (power) from SW_CPU_RESET / task watchdog
# (CPU starvation) after any unexpected reboot. Heap Max Block is the one that
# tracks the voice-assistant failure: it drops to ~39-43 KB during playback and
# the wake word stops arming.

debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: uptime
    id: device_uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"
    block:
      id: heap_max_block
      name: "Heap Max Block"
    min_free:
      name: "Heap Min Free"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"

# --- Optional: force the LED ring colour at boot -----------------------------
# The ring colour now lives in restore_value globals (user_led_ring_color_r/g/b,
# default 255/0/255 = purple) plus the "LED Ring Color Preset" select. Because
# they restore, a YAML initial_value no longer wins — the stored runtime value
# does. Setting the preset once in Home Assistant persists, including across the
# 05:00 restart, so that is the low-risk way to get blue back.
#
# Uncomment below only if you want it declared in config instead. NOTE: the
# packages already define esphome.on_boot; if list merging replaces rather than
# appends, this breaks their init sequence. Verify the LEDs still animate
# normally after flashing.
#
# esphome:
#   on_boot:
#     - priority: -100
#       then:
#         - select.set:
#             id: user_led_color_preset
#             option: "Blue"

# --- Optional extras ---------------------------------------------------------
# Uncomment to expose the device in a specific HA area name in the logs, etc.
# esphome:
#   area: Office

# If you'd rather have the TTS response come out of a *different* speaker
# (e.g. a Sonos) and not this one, uncomment to drop the local player from the
# voice pipeline. Leave it commented if you want music on this device.
# voice_assistant:
#   media_player: !remove