sensor:
  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor
    update_interval: 120s
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 120s
    lambda: |-
      // BQ27220 StateOfCharge, standard command 0x2C. No unseal needed.
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        ESP_LOGW("battery", "BQ27220 SoC read failed, i2c error=%d", (int) err);
        return NAN;
      }
      return static_cast<float>(static_cast<uint16_t>(raw[0]) |
                               (static_cast<uint16_t>(raw[1]) << 8));
  # Voltage and current are the diagnostic pair. If these read fine but SoC
  # does not, it is a register problem. If all three fail, the gauge is not on
  # the bus at all - check the scan lines in the boot log.
  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 120s
    lambda: |-
      uint8_t reg = 0x08;                      // Voltage()
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      return static_cast<float>(static_cast<uint16_t>(raw[0]) |
                               (static_cast<uint16_t>(raw[1]) << 8));
  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 120s
    lambda: |-
      uint8_t reg = 0x0C;                      // AverageCurrent(), signed
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      uint16_t v = static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(static_cast<int16_t>(v));   // positive = charging
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 120s
    entity_category: diagnostic
# -----------------------------------------------------------------------------
# PDM microphone
#
# ESPHome's defaults here are wrong for a single PDM mic and produce exactly
# what you saw: 15 seconds of listening, pure silence, and Whisper filling the
# void with "Thank you."
#
#   channel          default is `right`. A single PDM mic with its SELECT pin
#                    tied low sits on the LEFT channel - which is the usual
#                    wiring. Reading the right channel gives you digital
#                    silence, not quiet audio. THIS IS THE PRIME SUSPECT.
#   bits_per_sample  default is `32bit`. PDM mics want 16.
#   correct_dc_offset  PDM output averages off-zero; without this the signal
#                    can sit hard against a rail and clip to nothing.
#
# If it is still silent after this, flip `channel` to `right` and rebuild -
# that one line is the whole experiment.
# -----------------------------------------------------------------------------
microphone:
  - platform: i2s_audio
    id: onboard_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO20
    channel: left
    bits_per_sample: 16bit
    sample_rate: 16000
    correct_dc_offset: true
voice_assistant:
  microphone: onboard_mic
  use_wake_word: false
  # Gain knobs. Only worth touching once the mic is producing SOMETHING -
  # they cannot rescue digital silence. Uncomment one at a time; these have
  # moved between ESPHome releases and may not validate.
  # volume_multiplier: 2.0
  # auto_gain: 31dBFS
  # noise_suppression_level: 2
  # NO redraw in on_listening - start_voice has already painted that screen.
  # Refreshing here would block the loop while the mic is live, which is the
  # whole problem we are avoiding.
  on_listening:
    - logger.log:
        level: WARN
        format: "VA listening"
  # Capture the transcript but do NOT refresh yet. Audio has stopped by now,
  # but the reply lands a second or two later and one refresh is better than
  # two back to back.
  on_stt_end:
    - lambda: |-
        id(last_heard) = x;
    - logger.log:
        level: WARN
        format: "VA heard: '%s'"
        args: ['x.c_str()']
    - if:
        condition:
          lambda: 'return id(note_capture);'
        then:
          # A note, not a command. Stop the pipeline here so Home Assistant
          # does not try to ACT on "lunch is on the desk", then store the text
          # in the input_text helper and show the card.
          - voice_assistant.stop:
          - homeassistant.action:
              action: input_text.set_value
              data:
                entity_id: ${note_entity}
              data_template:
                value: "{{ note }}"
              variables:
                note: !lambda 'return id(last_heard);'
          - lambda: |-
              id(note_capture) = false;
              id(note_sleep_card) = false;
              id(ui_mode) = 4;
          - script.execute: redraw
        else:
          - lambda: 'id(ui_mode) = 2;'
  on_tts_start:
    - if:
        condition:
          lambda: 'return id(note_capture) || id(ui_mode) == 4;'
        then:
          - logger.log: "ignoring TTS - that was a note"
        else:
          - lambda: |-
              id(last_reply) = x;
              if (id(last_heard).empty()) id(last_heard) = "(nothing heard)";
              id(ui_mode) = 3;
    - script.execute: beep
    - script.execute: redraw
    - script.execute: back_to_menu
  on_end:
    - if:
        condition:
          lambda: 'return id(ui_mode) != 3 && id(ui_mode) != 4;'
        then:
          - lambda: |-
              id(note_capture) = false;
              id(ui_mode) = 0;
          - script.execute: redraw
  on_error:
    - lambda: |-
        id(last_reply) = std::string("Sorry - ") + message;
        id(ui_mode) = 3;
    - script.execute: redraw
    - script.execute: back_to_menu
touchscreen:
  - platform: gt911
    i2c_id: i2c_touch
    id: sticky_touch
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    display: eink
    # NO transform. Axis correction now happens in software below, via the
    # "Touch Flip X" / "Touch Flip Y" switches in Home Assistant, so getting
    # it wrong costs a toggle instead of a reflash.
    on_touch:
      - lambda: |-
          int rx = touch.x, ry = touch.y;
          int x = rx, y = ry;
          if (id(flip_x).state) x = 479 - x;
          if (id(flip_y).state) y = 799 - y;
          // What a tap means depends on which screen is showing.
          //   0-3 entity tiles   4 voice / cancel   5 back
          int t = -1;
          //   0-3 tiles  4 talk/cancel  5 back  6 note  7 clear  8 new note
          if (id(ui_mode) == 0) {
            if      (y >=  72 && y <= 294) t = (x < 240) ? 0 : 1;
            else if (y >= 306 && y <= 528) t = (x < 240) ? 2 : 3;
            else if (y >= 542 && y <= 722) t = (x < 240) ? 4 : 6;
          } else if (id(ui_mode) == 1 || id(ui_mode) == 2) {
            t = 4;                                  // anywhere cancels
          } else if (id(ui_mode) == 3) {
            if (x >= 12 && x <= 468 && y >= 660 && y <= 752) t = 5;
          } else if (id(ui_mode) == 4) {
            if (y >= 660 && y <= 752) {
              if      (x <= 157) t = 5;      // BACK
              else if (x >= 322) t = 7;      // CLEAR
              else               t = 8;      // NEW
            }
          }
          id(hit_tile) = t;
          ESP_LOGD("touch", "raw=%d,%d  mapped=%d,%d  mode=%d  tile=%d",
                   rx, ry, x, y, id(ui_mode), t);
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      # entity tiles
      - if:
          condition:
            lambda: 'return id(ui_mode) == 0 && id(hit_tile) >= 0 && id(hit_tile) <= 3;'
          then:
            - script.execute:
                id: do_toggle
                idx: !lambda 'return id(hit_tile);'
      # voice tile / cancel
      - if:
          condition:
            lambda: 'return id(hit_tile) == 4;'
          then:
            - if:
                condition:
                  lambda: 'return id(ui_mode) == 0;'
                then:
                  - script.execute: start_voice
                else:
                  - script.execute: beep
                  - voice_assistant.stop:
                  - script.stop: back_to_menu
                  - lambda: 'id(ui_mode) = 0;'
                  - script.execute: redraw
      # BACK
      - if:
          condition:
            lambda: 'return id(hit_tile) == 5;'
          then:
            - script.execute: go_back
      # NOTE tile. If a note already exists this OPENS it - so you can read it
      # and clear it. Only dictates a new one when there is nothing there.
      - if:
          condition:
            lambda: 'return id(hit_tile) == 6 && id(ui_mode) == 0;'
          then:
            - if:
                condition:
                  lambda: |-
                    std::string n = id(st_note).state;
                    return !n.empty() && n != "unknown" && n != "unavailable";
                then:
                  - script.execute: beep
                  - lambda: |-
                      id(note_sleep_card) = false;
                      id(ui_mode) = 4;
                  - script.execute: redraw
                else:
                  - script.execute: start_note
      # NEW - re-dictate from the note card
      - if:
          condition:
            lambda: 'return id(hit_tile) == 8;'
          then:
            - script.execute: start_note
      # CLEAR the note
      - if:
          condition:
            lambda: 'return id(hit_tile) == 7;'
          then:
            - script.execute: clear_note
binary_sensor:
  - platform: homeassistant
    id: st_tile1
    entity_id: ${tile1_entity}
    on_state:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tile2
    entity_id: ${tile2_entity}
    on_state:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tile3
    entity_id: ${tile3_entity}
    on_state:
      - script.execute: redraw
  # ---- physical buttons ----
  # Any of the three also wakes the panel from deep sleep.
  # OK   = start a voice session, or dismiss a reply
  # UP   = refresh the screen
  # DOWN = refresh the screen
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      # also declared as a deep-sleep ext1 wake source
      allow_other_uses: true
    id: btn_up
    name: "Button UP"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      - script.execute: beep
      - script.execute: redraw
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
      # also declared as a deep-sleep ext1 wake source
      allow_other_uses: true
    id: btn_down
    name: "Button DOWN"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      - script.execute: beep
      - script.execute: redraw
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      # also declared as a deep-sleep ext1 wake source
      allow_other_uses: true
    id: btn_ok
    name: "Button OK"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: 'id(awake_ms) = ${awake_after_button_ms};'
      - script.execute: idle_timer
      - if:
          condition:
            lambda: 'return id(ui_mode) == 0;'
          then:
            - script.execute: start_voice
          else:
            - if:
                condition:
                  lambda: 'return id(ui_mode) == 3;'
                then:
                  - script.execute: go_back
                else:
                  - script.execute: beep
text_sensor:
  # The note itself. Lives in Home Assistant so it survives deep sleep and can
  # be set from a phone.
  - platform: homeassistant
    id: st_note
    entity_id: ${note_entity}
    on_value:
      - script.execute: redraw
  - platform: homeassistant
    id: st_tile4
    entity_id: ${tile4_entity}
    on_value:
      - script.execute: redraw
script:
  # ONE path to the screen. Every trigger calls this instead of
  # component.update, and mode: restart collapses a burst of state changes
  # into a single refresh. Without this, HA state arriving for four entities
  # at once fires four overlapping refreshes and the driver throws
  # "Display already in state POWER_OFF".
  # A full refresh on this panel is ASYNCHRONOUS and takes SECONDS. ESPHome's
  # `component.update` only kicks the state machine off; the work happens over
  # many loop iterations while it waits on the busy pin. Calling update again
  # before it reaches IDLE is rejected outright:
  #     [E][epaper_spi]: Display already in state POWER_OFF
  # ...and that frame is simply lost.
  #
  # So this is `queued`, not `restart`, with a tail delay that holds the queue
  # until the panel has genuinely finished. Refreshes now serialise instead of
  # trampling each other. max_runs caps a burst at two.
  - id: redraw
    mode: queued
    max_runs: 2
    then:
      - delay: 900ms
      - logger.log:
          level: WARN
          format: "REDRAW  t1=%d t2=%d t3=%d t4=%s"
          args:
            - id(st_tile1).state
            - id(st_tile2).state
            - id(st_tile3).state
            - id(st_tile4).state.c_str()
      - component.update: eink
      # Hold the queue open until the refresh is actually done.
      - delay: 6s
  # ---------------------------------------------------------------------------
  # Draw the listening screen BEFORE the microphone opens.
  #
  # A full ePaper refresh blocks the main loop for well over a second. If the
  # voice pipeline is already streaming when that happens, the I2S buffer is
  # not serviced and the audio arrives at Home Assistant full of holes - or
  # as near-silence. Whisper's response to near-silence is to hallucinate a
  # common phrase, which is why you got "thank you" instead of what you said.
  #
  # So: cancel any pending redraw, paint the listening screen, let the panel
  # settle, and only then start the mic. Costs ~2 s before it listens, but
  # the audio is clean.
  # ---------------------------------------------------------------------------
  - id: start_voice
    mode: single
    then:
      # 1. Soft low pip immediately, so the tap does not feel dead.
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1800Hz
      - light.turn_on:
          id: buzzer
          brightness: 45%
      - delay: 35ms
      - light.turn_off: buzzer
      # 2. Paint the listening screen and wait for it to finish.
      - script.stop: redraw
      - lambda: |-
          id(ui_mode) = 1;
          id(last_heard) = "";
          id(last_reply) = "";
      - component.update: eink
      - delay: 250ms
      # 3. Two high pips = "speak now". These run inline rather than as a
      #    separate script so they are guaranteed to FINISH before the mic
      #    opens - otherwise the buzzer is the first thing Whisper hears.
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 3200Hz
      - light.turn_on:
          id: buzzer
          brightness: 70%
      - delay: 55ms
      - light.turn_off: buzzer
      - delay: 55ms
      - light.turn_on:
          id: buzzer
          brightness: 70%
      - delay: 55ms
      - light.turn_off: buzzer
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 2700Hz
      # 4. Let the buzzer stop ringing, then open the mic.
      - delay: 150ms
      - voice_assistant.start:
  # ---------------------------------------------------------------------------
  # Dictate a note. Same pre-roll as start_voice - screen first, then pips,
  # then the mic - but flagged so the transcript is kept as a note instead of
  # being run as a command.
  # ---------------------------------------------------------------------------
  - id: start_note
    mode: single
    then:
      - lambda: 'id(note_capture) = true;'
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 1800Hz
      - light.turn_on:
          id: buzzer
          brightness: 45%
      - delay: 35ms
      - light.turn_off: buzzer
      - script.stop: redraw
      - lambda: |-
          id(ui_mode) = 1;
          id(last_heard) = "";
          id(last_reply) = "";
      - component.update: eink
      - delay: 250ms
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 3200Hz
      - light.turn_on:
          id: buzzer
          brightness: 70%
      - delay: 55ms
      - light.turn_off: buzzer
      - delay: 55ms
      - light.turn_on:
          id: buzzer
          brightness: 70%
      - delay: 55ms
      - light.turn_off: buzzer
      - output.ledc.set_frequency:
          id: buzzer_pwm
          frequency: 2700Hz
      - delay: 150ms
      - voice_assistant.start:
  - id: clear_note
    mode: single
    then:
      - script.execute: beep
      - homeassistant.action:
          action: input_text.set_value
          data:
            entity_id: ${note_entity}
            value: ""
      - lambda: |-
          id(ui_mode) = 0;
          id(note_sleep_card) = false;
      - script.execute: redraw
  # Restarted by every interaction. When it finally runs out, we sleep.
  # mode: restart - so ANY interaction pushes sleep back by the full window.
  # If the panel never sleeps, this log is where to look: a line every few
  # seconds means something keeps restarting the countdown (a stray touch,
  # usually), rather than the sleep code being broken.
  - id: idle_timer
    mode: restart
    then:
      - logger.log:
          level: WARN
          format: "idle timer armed for %d ms"
          args: ['id(awake_ms)']
      - delay: !lambda 'return id(awake_ms);'
      - logger.log:
          level: WARN
          format: "idle timer expired - trying to sleep"
      - script.execute: go_to_sleep
  - id: go_to_sleep
    mode: single
    then:
      # Compile-time flag, so this whole branch folds away to nothing when
      # low_power is "true".
      - if:
          condition:
            lambda: 'return std::string("${low_power}") != "true";'
          then:
            - logger.log:
                level: WARN
                format: "NOT SLEEPING - low_power is set to false in the config"
          else:
            # ---------------------------------------------------------------
            # THIS is what was corrupting the screen.
            #
            # The old version fired a refresh, waited 300 ms, then entered
            # deep sleep. But a full refresh takes SECONDS - so the MCU was
            # cutting power to the panel roughly a tenth of the way through
            # its waveform. What you were left looking at was a half-written
            # frame: inverted polarity, horizontal banding. Not a wake bug at
            # all - the damage was done on the way DOWN.
            #
            # Two changes. Only refresh if the screen is not already showing
            # the menu, and then wait long enough for the panel to finish.
            # ---------------------------------------------------------------
            # If a note is set, that is what the panel should be showing while
            # it sleeps - ePaper holds the image with no power, so the note
            # stays readable on the wall for days.
            - lambda: |-
                std::string n = id(st_note).state;
                bool have_note = !n.empty() && n != "unknown" && n != "unavailable";
                int target = have_note ? 4 : 0;
                id(sleep_redraw)    = (id(ui_mode) != target) || have_note;
                id(note_sleep_card) = have_note;
                id(ui_mode)         = target;
            - if:
                condition:
                  lambda: 'return id(sleep_redraw);'
                then:
                  - script.stop: redraw
                  - component.update: eink
                  - logger.log:
                      level: WARN
                      format: "waiting for panel before sleep"
                  - delay: 10s
            # Drop the rails we do not need held.
            - output.turn_off: mic_power_enable
            - switch.turn_off: touch_power_enable
            - logger.log:
                level: WARN
                format: "sleeping"
            - delay: 200ms
            # Pin GPIO45/46 (the power latch) so the device sleeps rather
            # than switching itself off. Per-pin hold FIRST, so that
            # gpio_deep_sleep_hold_en() latches only these two rather than
            # freezing every pad on the chip - the display's pins in
            # particular need to stay free.
            - lambda: |-
                gpio_hold_en((gpio_num_t) 45);
                gpio_hold_en((gpio_num_t) 46);
                gpio_deep_sleep_hold_en();
            # on_boot calls deep_sleep.prevent so the device does not sleep
            # the instant it starts up. `deep_sleep.enter` is a manual entry
            # and bypasses that flag - but clearing it explicitly first costs
            # nothing and removes any doubt.
            - deep_sleep.allow: sleeper
            - deep_sleep.enter: sleeper
  - id: late_redraw
    mode: restart
    then:
      - delay: 15s
      - script.execute: redraw
  - id: beep
    mode: restart
    then:
      - light.turn_on:
          id: buzzer
          brightness: 60%
      - delay: 40ms
      - light.turn_off: buzzer
  # Explicit dismiss - the BACK button and the OK key both land here.
  - id: go_back
    mode: single
    then:
      - script.execute: beep
      - script.stop: back_to_menu
      - lambda: |-
          id(ui_mode) = 0;
          id(last_heard) = "";
          id(last_reply) = "";
      - script.execute: redraw
  # Safety net only. You dismiss the reply yourself now, but a wall panel
  # should not sit on a stale answer indefinitely if nobody comes back to it.
  - id: back_to_menu
    mode: restart
    then:
      - delay: 3min
      - lambda: |-
          id(ui_mode) = 0;
          id(last_heard) = "";
          id(last_reply) = "";
      - script.execute: redraw
  - id: do_toggle
    mode: single
    parameters:
      idx: int
    then:
      - script.execute: beep
      # `homeassistant.toggle` is domain-agnostic - it works on lights,
      # switches, fans, input_booleans and media_players alike. That is why
      # pointing a tile at a different KIND of entity needs no change here,
      # only the entity id at the top of the file.
      - if:
          condition:
            lambda: 'return idx == 0;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile1_entity}
      - if:
          condition:
            lambda: 'return idx == 1;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile2_entity}
      - if:
          condition:
            lambda: 'return idx == 2;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: ${tile3_entity}
      - if:
          condition:
            lambda: 'return idx == 3 && (id(st_tile4).state == "open" || id(st_tile4).state == "opening");'
          then:
            - homeassistant.action:
                action: cover.close_cover
                data:
                  entity_id: ${tile4_entity}
      - if:
          condition:
            lambda: 'return idx == 3 && id(st_tile4).state != "open" && id(st_tile4).state != "opening";'
          then:
            - homeassistant.action:
                action: cover.open_cover
                data:
                  entity_id: ${tile4_entity}
      # No refresh here on purpose. The incoming HA state change fires the
      # redraw by itself - the log shows it landing ~1.5 s after each tap.
      # The extra "insurance" refresh was arriving while the panel was still
      # mid-cycle, which is exactly what produced the
      # "Display already in state POWER_OFF" errors.
      # Covers take ~13 s to finish travelling, so catch the settled state.
      - if:
          condition:
            lambda: 'return idx == 3;'
          then:
            - script.execute: late_redraw
display:
  - platform: epaper_spi
    id: eink
    model: seeed-reterminal-sticky
    rotation: 90
    # NO full_update_every. Partial refresh on this panel drops draw calls and
    # smears the previous frame. Full refresh every time, always correct.
    # never = the display does not schedule itself; the redraw script owns it.
    update_interval: never
    lambda: |-
      // ---------------------------------------------------------------
      // On this panel COLOR_OFF is the INK and COLOR_ON is the PAPER.
      // Naming them removes any chance of getting it backwards again.
      // ---------------------------------------------------------------
      const Color INK   = COLOR_OFF;
      const Color PAPER = COLOR_ON;
      const int W = 480;
      const int H = 800;
      auto thick_box = [&](int x, int y, int w, int h, int t) {
        for (int i = 0; i < t; i++) it.rectangle(x + i, y + i, w - 2*i, h - 2*i, INK);
      };
      // A deliberately imperfect rectangle. Straight lines look printed;
      // a bit of jitter reads as handwritten, which is the whole point of a
      // note left on the fridge.
      auto wobbly_box = [&](int x0, int y0, int x1, int y1) {
        const int j[10] = {0, 2, -1, 1, -2, 1, 0, -1, 2, -1};
        int k = 0;
        for (int x = x0; x < x1; x += 46) {
          int xe = (x + 46 > x1) ? x1 : x + 46;
          it.line(x, y0 + j[k % 10], xe, y0 + j[(k + 1) % 10], INK);
          it.line(x, y1 + j[(k + 3) % 10], xe, y1 + j[(k + 4) % 10], INK);
          k++;
        }
        k = 0;
        for (int y = y0; y < y1; y += 46) {
          int ye = (y + 46 > y1) ? y1 : y + 46;
          it.line(x0 + j[k % 10], y, x0 + j[(k + 1) % 10], ye, INK);
          it.line(x1 + j[(k + 5) % 10], y, x1 + j[(k + 6) % 10], ye, INK);
          k++;
        }
      };
      // Break a string into lines of at most `maxc` characters, on spaces.
      auto wrap = [](std::string s, size_t maxc) {
        std::vector<std::string> out;
        while (!s.empty() && out.size() < 10) {
          size_t cut = s.size();
          if (s.size() > maxc) {
            size_t sp = s.rfind(' ', maxc);
            cut = (sp == std::string::npos || sp == 0) ? maxc : sp;
          }
          out.push_back(s.substr(0, cut));
          s = (cut < s.size()) ? s.substr(cut) : std::string("");
          while (!s.empty() && s[0] == ' ') s.erase(0, 1);
        }
        return out;
      };
      // ======================= HEADER =======================
      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        it.strftime(14, 10, id(f_body), INK, TextAlign::TOP_LEFT, "%a %H:%M", now);
      }
      // ---- battery gauge: outline, proportional fill, percentage ----
      {
        const int bx = W - 62, by = 13, bw = 44, bh = 22;
        it.rectangle(bx, by, bw, bh, INK);                // body
        it.filled_rectangle(bx + bw, by + 7, 4, 8, INK);  // terminal nub
        float pct = id(battery_level).state;
        if (!isnan(pct)) {
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          int fill = (int) ((bw - 6) * pct / 100.0f);
          if (fill > 0) it.filled_rectangle(bx + 3, by + 3, fill, bh - 6, INK);
          it.printf(bx - 8, 10, id(f_body), INK, TextAlign::TOP_RIGHT, "%.0f%%", pct);
        } else {
          // Gauge not answering. Draw the empty outline anyway so the absence
          // is visible rather than silently blank.
          it.print(bx - 8, 10, id(f_body), INK, TextAlign::TOP_RIGHT, "--");
        }
        // Charging: a small bolt to the left of the readout.
        if (!isnan(id(battery_current).state) && id(battery_current).state > 20.0f) {
          int cx = bx - 78, cy = 13;
          it.line(cx + 8, cy,      cx + 2, cy + 11, INK);
          it.line(cx + 2, cy + 11, cx + 9, cy + 11, INK);
          it.line(cx + 9, cy + 11, cx + 3, cy + 22, INK);
        }
      }
      it.filled_rectangle(14, 48, W - 28, 2, INK);
      // ======================== MENU ========================
      if (id(ui_mode) == 0) {
        const int TW = 222, TH = 222;
        const int tx[4] = { 12, 246,  12, 246};
        const int ty[4] = { 72,  72, 306, 306};
        const char* names[4] = {"${tile1_label}", "${tile2_label}",
                                "${tile3_label}", "${tile4_label}"};
        bool on[4];
        on[0] = id(st_tile1).state;
        on[1] = id(st_tile2).state;
        on[2] = id(st_tile3).state;
        // A cover is not just open/closed - it spends ~13 s in opening/closing.
        // Treating those as "not open" is what made a blinds press look like
        // nothing had happened.
        std::string bs = id(st_tile4).state;
        on[3] = (bs == "open" || bs == "opening");
        const char* states[4];
        states[0] = on[0] ? "ON" : "OFF";
        states[1] = on[1] ? "ON" : "OFF";
        states[2] = on[2] ? "ON" : "OFF";
        states[3] = (bs == "open")    ? "OPEN"
                  : (bs == "closed")  ? "CLOSED"
                  : (bs == "opening") ? "OPENING"
                  : (bs == "closing") ? "CLOSING"
                  : "--";
        for (int i = 0; i < 4; i++) {
          int x = tx[i], y = ty[i];
          bool inv = on[i];
          // ON  = solid ink tile, paper-coloured contents
          // OFF = paper tile with a 3 px ink border, ink contents
          Color fg = inv ? PAPER : INK;
          Color bg = inv ? INK   : PAPER;
          if (inv) {
            it.filled_rectangle(x, y, TW, TH, INK);
          } else {
            thick_box(x, y, TW, TH, 3);
          }
          int ix = x + (TW - 96) / 2;
          switch (i) {
            case 0: it.image(ix, y + 20, id(ic_tile1), fg, bg); break;
            case 1: it.image(ix, y + 20, id(ic_tile2), fg, bg); break;
            case 2: it.image(ix, y + 20, id(ic_tile3), fg, bg); break;
            case 3: it.image(ix, y + 20, id(ic_tile4), fg, bg); break;
          }
          it.printf(x + TW/2, y + 126, id(f_tile), fg, TextAlign::TOP_CENTER,
                    "%s", names[i]);
          it.printf(x + TW/2, y + 166, id(f_state), fg, TextAlign::TOP_CENTER,
                    "%s", states[i]);
        }
        // ---- bottom row: TALK on the left, NOTE on the right ----
        // The NOTE tile inverts when a note is set, so you can see at a glance
        // that there is something on the fridge without opening it.
        std::string nt = id(st_note).state;
        bool have_note = !nt.empty() && nt != "unknown" && nt != "unavailable";
        thick_box(12, 542, 222, 180, 3);
        it.image(91, 566, id(ic_mic), INK, PAPER);
        it.print(123, 648, id(f_tile), INK, TextAlign::TOP_CENTER, "${voice_label}");
        if (have_note) {
          it.filled_rectangle(246, 542, 222, 180, INK);
          it.image(325, 566, id(ic_note), PAPER, INK);
          it.print(357, 648, id(f_tile), PAPER, TextAlign::TOP_CENTER, "${note_label}");
        } else {
          thick_box(246, 542, 222, 180, 3);
          it.image(325, 566, id(ic_note), INK, PAPER);
          it.print(357, 648, id(f_tile), INK, TextAlign::TOP_CENTER, "${note_label}");
        }
        // ---- footer ----
        if (id(temp_sensor).has_state()) {
          it.printf(14, H - 16, id(f_small), INK, TextAlign::BASELINE_LEFT,
                    "%.1f C", id(temp_sensor).state);
        }
        it.print(W - 14, H - 16, id(f_small), INK, TextAlign::BASELINE_RIGHT,
                 "${footer_text}");
        // Make the power mode visible on the device itself.
        if (std::string("${low_power}") != "true") {
          it.print(W / 2, H - 16, id(f_small), INK, TextAlign::BASELINE_CENTER,
                   "always on");
        }
      }
      // ====================== LISTENING =====================
      else if (id(ui_mode) == 1) {
        it.image(160, 200, id(ic_listening), INK, PAPER);
        it.print(240, 400, id(f_head), INK, TextAlign::TOP_CENTER, "Listening...");
        it.print(240, 452, id(f_body), INK, TextAlign::TOP_CENTER, "speak now");
        it.filled_rectangle(60, 560, 360, 8, INK);
        it.print(240, 700, id(f_small), INK, TextAlign::TOP_CENTER,
                 "tap anywhere to cancel");
      }
      // ======================= THINKING =====================
      else if (id(ui_mode) == 2) {
        it.image(160, 200, id(ic_thinking), INK, PAPER);
        it.print(240, 400, id(f_head), INK, TextAlign::TOP_CENTER, "Thinking...");
        if (!id(last_heard).empty()) {
          it.printf(240, 456, id(f_body), INK, TextAlign::TOP_CENTER,
                    "\"%s\"", id(last_heard).c_str());
        }
      }
      // ========================= NOTE =======================
      else if (id(ui_mode) == 4) {
        const bool card_only = id(note_sleep_card);
        const int  cy1 = card_only ? 780 : 640;
        wobbly_box(20, 62, W - 20, cy1);
        wobbly_box(28, 70, W - 28, cy1 - 8);
        it.image(48, 92, id(ic_accent), INK, PAPER);
        it.print(48, 146, id(f_head), INK, TextAlign::TOP_LEFT, "${note_greeting}");
        std::string nt = id(st_note).state;
        if (nt == "unknown" || nt == "unavailable") nt = "";
        if (nt.empty()) nt = "(no note)";
        // Pick the biggest size the note actually fits in, rather than using
        // one small size for everything. Most notes are a line or two, and a
        // line or two of 31 px type floating in a 700 px card looks lost.
        auto nl = wrap(nt, 16);
        auto nf = id(f_note_xl);
        int  lh = 64;
        if (nl.size() > 3) { nl = wrap(nt, 21); nf = id(f_note_lg); lh = 52; }
        if (nl.size() > 4) { nl = wrap(nt, 26); nf = id(f_reply);   lh = 44; }
        // Centre the block in the space between the greeting and the doodle,
        // so a one-line note sits where the eye lands instead of hugging the
        // top with a void beneath it.
        const int band_top = 206;
        const int band_bot = cy1 - 170;
        int blockh = (int) nl.size() * lh;
        int ny = band_top + (band_bot - band_top - blockh) / 2;
        if (ny < band_top) ny = band_top;
        for (size_t i = 0; i < nl.size(); i++) {
          it.print(44, ny, nf, INK, TextAlign::TOP_LEFT, nl[i].c_str());
          ny += lh;
        }
        it.image(W - 170, cy1 - 150, id(ic_doodle), INK, PAPER);
        // No buttons on the sleep card - nothing can be pressed while it is
        // asleep, and drawing them would be a lie.
        if (!card_only) {
          // BACK  |  NEW  |  CLEAR
          it.filled_rectangle(12, 660, 145, 92, INK);
          it.print(84, 690, id(f_tile), PAPER, TextAlign::TOP_CENTER, "BACK");
          thick_box(167, 660, 145, 92, 3);
          it.print(239, 690, id(f_tile), INK, TextAlign::TOP_CENTER, "NEW");
          thick_box(322, 660, 146, 92, 3);
          it.print(395, 690, id(f_tile), INK, TextAlign::TOP_CENTER, "CLEAR");
        }
      }
      // ======================== REPLY =======================
      else {
        // ---- what you asked: inverted band, full bleed. Same visual
        // ---- language as an ON tile, so the panel reads as one system.
        auto q = wrap(id(last_heard), 30);
        if (q.size() > 2) q.resize(2);
        int qh = 16 + (int) q.size() * 27 + 13;
        it.filled_rectangle(0, 58, W, qh, INK);
        for (size_t i = 0; i < q.size(); i++) {
          it.print(W / 2, 58 + 14 + (int) i * 27, id(f_body), PAPER,
                   TextAlign::TOP_CENTER, q[i].c_str());
        }
        // ---- the answer is the hero. Big, and optically centred in the
        // ---- space between the band and the button rather than hugging
        // ---- the top with a void underneath.
        std::string rtext = id(last_reply).empty() ? std::string("(no reply)")
                                                   : id(last_reply);
        auto r = wrap(rtext, 24);
        const int LH = 42;
        int top   = 58 + qh;
        int avail = 646 - top;
        int blockh = (int) r.size() * LH;
        int ry = top + (avail - blockh) / 2;
        if (ry < top + 12) ry = top + 12;
        for (size_t i = 0; i < r.size(); i++) {
          it.print(W / 2, ry + (int) i * LH, id(f_reply), INK,
                   TextAlign::TOP_CENTER, r[i].c_str());
        }
        // ---- BACK: full width, solid, unmissable.
        // ---- Geometry must match the touch test in on_touch.
        it.filled_rectangle(12, 660, 456, 92, INK);
        it.image(157, 686, id(ic_back), PAPER, INK);
        it.print(213, 684, id(f_head), PAPER, TextAlign::TOP_LEFT, "BACK");
      }
# Clock refresh. Goes through the same debounced path as everything else.
interval:
  - interval: 10min
    then:
      - script.execute: redraw
button:
  - platform: template
    name: "Force Redraw"
    on_press:
      - script.execute: redraw
  - platform: template
    name: "Start Voice"
    on_press:
      - voice_assistant.start:
  - platform: restart
    name: "Restart"
    entity_category: config
# =============================================================================
#  BUILD NOTES / HISTORY
#  Kept for reference. Nothing here affects the config.
# =============================================================================
# =============================================================================
#  reTerminal Sticky - Living Room controller  (v21)
#
#  PORTRAIT 480 x 800.
#
#      +------------+------------+
#      | Main Light |   Cinema   |
#      +------------+------------+
#      |     TV     |   Blinds   |
#      +------------+------------+
#      |      TAP TO TALK        |
#      +-------------------------+
#
#  ---------------------------------------------------------------------------
#  v10 - TOUCH, SETTLED
#  ---------------------------------------------------------------------------
#  Final answer for this board at rotation: 90 -
#      NO `transform:` on the touchscreen
#      Touch Flip X = OFF
#      Touch Flip Y = ON
#
#  Both flips are runtime switches in Home Assistant, so if you ever change
#  the display rotation you re-calibrate by toggling, not recompiling.
#
#  How it was worked out: with both flips off, tapping the top row started a
#  voice session (800 - 180 = 620, the voice tile) while tapping the sides of
#  the voice tile toggled the light and the lamp (800 - 630 = 170, the top
#  row). Left/right were landing correctly, so only Y was inverted.
#
#  ---------------------------------------------------------------------------
#  v8 - TOUCH X MIRROR (superseded by v10)
#  ---------------------------------------------------------------------------
#  Tapping TV (left column) was hitting Blinds (right column). The footer
#  dev-readout gave it away: the tap logged x=351 when it should have been
#  ~120, and 480 - 351 = 129. A clean mirror, nothing subtler.
#  transform now has BOTH mirror_x and mirror_y. Rows were already landing
#  correctly, so only the horizontal axis needed flipping.
#
#  ---------------------------------------------------------------------------
#  v7 - BATTERY
#  ---------------------------------------------------------------------------
#  Fuel gauge reads now. GPIO39 charger-enable had been missing from the
#  config; with it driven the BQ27220 answers on 0x55.
#
#  ---------------------------------------------------------------------------
#  v5 - THE COLOUR BUG
#  ---------------------------------------------------------------------------
#  COLOR_ON and COLOR_OFF are the opposite way round to what I assumed on this
#  panel. On this ePaper, COLOR_OFF is the INK and COLOR_ON is the PAPER.
#  v3/v4 drew borders, headers and OFF-state labels in COLOR_ON - i.e. white
#  on white. Invisible. That single mistake produced every symptom:
#
#    - no tile borders anywhere        (drawn white)
#    - no header, no clock, no battery (drawn white)
#    - OFF tiles had no label          (drawn white)
#    - ON tiles had no black fill      (fill drawn white) but DID show their
#      icon and text, because those used COLOR_OFF = real ink
#    - v3's grey boxes round the Main Light and Lamp icons were the icon
#      BACKGROUND painted in COLOR_OFF - black - on the OFF tiles
#    - the calibration screen was blank end to end: every element in it
#      was drawn in COLOR_ON
#
#  Seeed's own examples use COLOR_OFF for everything, which is the tell I
#  should have followed. The lambda now uses named INK / PAPER constants so
#  this cannot happen again.
#
#  Also fixed: the "Display already in state POWER_OFF" spam. Ten different
#  triggers were each calling component.update, so refreshes piled up on top
#  of each other mid-cycle. Everything now goes through one debounced `redraw`
#  script, so a burst of state changes collapses into a single refresh.
#
#  ---------------------------------------------------------------------------
#  WHAT CHANGED IN v4, AND WHY
#  ---------------------------------------------------------------------------
#  A. full_update_every: 12 is GONE. That was the real villain. Partial
#     refresh on this panel was silently dropping whole draw operations - it
#     is why not one single rectangle appeared on the screen, and why the mic
#     icon "breaks up" on tap. Every refresh is now a full one. Slower
#     (roughly a second), completely reliable.
#
#     Knock-on effect: with no rectangles rendering, the ON tiles had no black
#     fill - and their labels are drawn in WHITE for contrast against that
#     fill. White text on white paper. That is why "Main Light" and "Lamp" had
#     no captions while TV and Blinds did. One bug, two symptoms.
#
#  B. Touch Y axis flipped. Tapping Main Light (y~190) was landing on the
#     voice tile (y~610) - 800 minus 190. The display model preset applies
#     mirror_x, and once the panel is rotated 90 deg to portrait that becomes
#     a flip along the axis the touchscreen thinks is X. The touchscreen has
#     no way to know the display did that, so we tell it. See `transform:`.
#     (Superseded by v10 - see the TOUCH AXES note above.)
#
#  C. Icons are TRANSPARENT_BINARY now, so they no longer carry an ugly filled
#     box around them, and they are 96 px instead of 76.
#
#  D. Tiles have real 3 px borders and fill the screen properly.
#
#  ---------------------------------------------------------------------------
#  TOUCH AXES
#  ---------------------------------------------------------------------------
#  No `transform:` on the touchscreen. Correction is done in software from two
#  switches in Home Assistant, so a rotation change is a toggle, not a rebuild.
#  Settled for this board at rotation: 90 -   Flip X = OFF,  Flip Y = ON
#
#  BUTTONS
#    OK    start a voice session / dismiss a reply / wake
#    UP    refresh the screen / wake
#    DOWN  refresh the screen / wake
# =============================================================================
