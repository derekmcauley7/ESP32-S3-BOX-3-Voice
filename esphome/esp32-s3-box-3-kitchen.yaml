api:
  encryption:
    key: !secret esphome_api_key
  actions:
    - action: show_snapshot
      variables:
        image_url: string
        duration_s: int
      then:
        - lambda: id(showing_snapshot) = true;
        - online_image.set_url:
            id: snapshot_image
            url: !lambda 'return image_url;'
        - delay: !lambda 'return duration_s * 1000;'
        - lambda: id(showing_snapshot) = false;
        # Don't yank the screen back to idle if a real voice interaction
        # is in progress when the timer elapses.
        - if:
            condition:
              not:
                - voice_assistant.is_running:
            then:
              - script.execute: set_idle_or_mute_phase
              - script.execute: draw_display
    # Weather icons are baked into the firmware at compile time (see the
    # `image:` block below) rather than fetched at runtime — no network
    # call, nothing to hang or fail. `icon_index` picks which of the 10
    # baked icons to show (0=01d, 1=01n, 2=02d, 3=03d, 4=04d, 5=09d,
    # 6=10d, 7=11d, 8=13d, 9=50d — matches the OpenWeatherMap icon codes
    # used by the icon_index mapping in the Home Assistant automation).
    - action: show_weather
      variables:
        icon_index: int
        temp_text: string
        condition_text: string
        duration_s: int
      then:
        - lambda: |-
            id(showing_weather) = true;
            id(weather_icon_index) = icon_index;
            id(weather_temp_text) = temp_text;
            id(weather_condition_text) = condition_text;
        - script.execute: draw_display
        - delay: !lambda 'return duration_s * 1000;'
        - lambda: id(showing_weather) = false;
        - if:
            condition:
              not:
                - voice_assistant.is_running:
            then:
              - script.execute: set_idle_or_mute_phase
              - script.execute: draw_display
    # Long-lived "now playing" art — stays up for as long as music plays
    # (no fixed duration), yields to real voice interactions, and resumes
    # automatically once you're done talking.
    - action: show_now_playing
      variables:
        image_url: string
      then:
        - lambda: id(showing_now_playing) = true;
        - online_image.set_url:
            id: now_playing_image
            url: !lambda 'return image_url;'
        - script.execute: draw_display
    - action: clear_now_playing
      then:
        - lambda: id(showing_now_playing) = false;
        - script.execute: draw_display
    # Lets Home Assistant silence a ringing timer remotely (e.g. from a
    # notification action button) the same way the physical top-left button
    # already does — `timer_ringing` is the stock package's internal switch
    # that drives the beeping; turning it off stops the sound (its own
    # on_turn_off handler, defined in the imported package, stops the media
    # player). This shows up in HA as the service
    # esphome.esp32_s3_box_3_a8d314_stop_timer once flashed.
    - action: stop_timer
      then:
        - switch.turn_off: timer_ringing
substitutions:
  name: esp32-s3-box-3-a8d314
  friendly_name: ESP32 S3 Box Kitchen
  # Base URL of your Home Assistant instance, used below for LAN image
  # fetches (doorbell snapshot, now-playing art). Point this at your own
  # HA's local IP or hostname.
  ha_base_url: "http://YOUR_HA_IP:8123"
packages:
  esphome.voice-assistant: "github://esphome/wake-word-voice-assistants/esp32-s3-box-3/esp32-s3-box-3.yaml@main"
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
# ---- everything below this line is new ----
# The stock package already transcribes what you asked into `text_request`
# (used to caption the "thinking" screen) but never exposes it to Home
# Assistant. Giving it a `name:` here makes it a normal HA sensor entity.
# BUT: text_request truncates itself to 31 characters + "..." (purely so the
# on-screen caption doesn't overflow) — which silently ate the word
# "tomorrow" off the end of "what's the weather like tomorrow", breaking the
# automation's day-matching. So we ALSO publish a second, untruncated copy
# dedicated to automations: on_stt_end already publishes the full text into
# text_request before it truncates itself, so grabbing the same value one
# step earlier gives us the real, complete question.
text_sensor:
  - id: !extend text_request
    name: "Last Question"
  - platform: template
    id: text_request_full
    name: "Last Question Full"
voice_assistant:
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request_full
        state: !lambda return x;
  # Reports a finished voice timer to Home Assistant. The stock package's
  # own on_timer_finished (ringing sound + display animation, defined in
  # the imported esp32-s3-box-3.yaml package) still runs exactly as before —
  # ESPHome concatenates same-named trigger lists from a package and this
  # file rather than replacing one with the other, so this is purely
  # additive. `timer` is provided by the voice_assistant component itself
  # for this trigger (fields: id, name, total_seconds, seconds_left,
  # is_active), no extra tracking needed.
  # Requires "Allow the device to perform Home Assistant actions" to be
  # enabled for this device under Settings -> Devices & Services -> ESPHome
  # in Home Assistant, otherwise this call is silently dropped.
  on_timer_finished:
    - homeassistant.event:
        event: esphome.voice_timer_finished
        data:
          source: "Kitchen Box"
        data_template:
          timer_name: '{{ name }}'
        variables:
          name: !lambda 'return timer.name;'
http_request:
  useragent: esphome/box3
  timeout: 10s
# `snapshot_image` (one-shot: doorbell/camera, JPEG, fixed duration) and
# `now_playing_image` (long-lived: album art, JPEG, up for as long as music
# plays) are both LAN-only fetches straight to your own HA instance — fast
# and reliable, so they stay runtime online_image sources. Weather icons
# used to be a third online_image hitting the public internet over HTTPS;
# that's what caused the crash (a slow/hung external HTTPS fetch can block
# long enough to trip the watchdog and reboot the device). Weather icons
# are now baked into the firmware instead — see the `image:` block below.
online_image:
  - url: "${ha_base_url}/local/doorbell_screen_snapshot.jpg"
    id: snapshot_image
    format: JPEG
    type: RGB
    resize: 320x240
    on_download_finished:
      - lambda: |-
          id(s3_box_lcd).show_page(snapshot_page);
          id(s3_box_lcd).update();
    on_error:
      - logger.log: "Snapshot: download failed"
  - url: "${ha_base_url}/local/doorbell_screen_snapshot.jpg"
    id: now_playing_image
    format: JPEG
    type: RGB
    resize: 320x240
    on_download_finished:
      - lambda: |-
          if (id(showing_now_playing) && id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(s3_box_lcd).show_page(now_playing_page);
            id(s3_box_lcd).update();
          }
    on_error:
      - logger.log: "Now playing art: download failed"
# The 10 weather icons ESPHome needs to cover every Home Assistant weather
# condition, downloaded and embedded into firmware at BUILD time (same
# mechanism the stock casita illustrations already use) — no runtime
# network dependency at all. Match the stock package's own image format
# exactly (type: RGB + transparency: alpha_channel) instead of RGB565:
# that's the format this display driver is actually proven to render
# correctly on this board, and it's also the semantically correct choice
# since the source PNGs have transparent backgrounds we want blended onto
# our black fill rather than flattened into solid squares.
image:
  - file: "https://openweathermap.org/img/wn/01d@2x.png"
    id: weather_icon_01d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/01n@2x.png"
    id: weather_icon_01n
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/02d@2x.png"
    id: weather_icon_02d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/03d@2x.png"
    id: weather_icon_03d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/04d@2x.png"
    id: weather_icon_04d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/09d@2x.png"
    id: weather_icon_09d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/10d@2x.png"
    id: weather_icon_10d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/11d@2x.png"
    id: weather_icon_11d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/13d@2x.png"
    id: weather_icon_13d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
  - file: "https://openweathermap.org/img/wn/50d@2x.png"
    id: weather_icon_50d
    resize: 150x150
    type: RGB
    transparency: alpha_channel
# Bigger display fonts for the redesigned weather card (temperature + condition
# word). Same Figtree family/glyphset the stock request/response fonts already
# use, just larger — these just append to the stock package's `font:` list.
font:
  - file:
      type: gfonts
      family: Figtree
      weight: 600
    id: font_weather_temp
    size: 56
    glyphsets:
      - GF_Latin_Core
  - file:
      type: gfonts
      family: Figtree
      weight: 400
    id: font_weather_condition
    size: 22
    glyphsets:
      - GF_Latin_Core
globals:
  - id: showing_snapshot
    type: bool
    restore_value: false
    initial_value: "false"
  - id: showing_weather
    type: bool
    restore_value: false
    initial_value: "false"
  - id: showing_now_playing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: weather_icon_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: weather_temp_text
    type: std::string
    restore_value: false
  - id: weather_condition_text
    type: std::string
    restore_value: false
# `!extend` merges into the package's existing `s3_box_lcd` display component
# instead of erroring on a duplicate id — this just appends new pages to its
# existing page list, everything else about the display is untouched.
display:
  - id: !extend s3_box_lcd
    pages:
      - id: snapshot_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(snapshot_image), ImageAlign::CENTER);
      - id: weather_page
        # Alexa-Show-style weather card: a vertical sky gradient keyed to the
        # condition (bright blue for sunny, deep navy for clear night, grey
        # for cloudy/rain/fog, pale grey for snow, dark for storms), the
        # condition icon on the left, and a big temperature + condition word
        # on the right — instead of just a bare icon on a black square.
        lambda: |-
          int r1, g1, b1, r2, g2, b2;
          switch (id(weather_icon_index)) {
            case 0: r1=80;  g1=170; b1=255; r2=200; g2=230; b2=255; break;  // sunny
            case 1: r1=10;  g1=15;  b1=40;  r2=40;  g2=50;  b2=90;  break;  // clear night
            case 2: r1=120; g1=170; b1=220; r2=210; g2=225; b2=235; break; // partly cloudy
            case 3: r1=140; g1=160; b1=180; r2=210; g2=215; b2=220; break; // breezy / few clouds
            case 4: r1=110; g1=120; b1=130; r2=180; g2=185; b2=190; break; // cloudy
            case 5: r1=70;  g1=80;  b1=100; r2=140; g2=150; b2=160; break; // heavy rain
            case 6: r1=60;  g1=75;  b1=100; r2=120; g2=130; b2=150; break; // rain
            case 7: r1=40;  g1=40;  b1=55;  r2=90;  g2=90;  b2=110; break; // storm
            case 8: r1=170; g1=180; b1=200; r2=230; g2=235; b2=240; break; // snow
            default: r1=150; g1=150; b1=150; r2=210; g2=210; b2=210; break; // fog / windy
          }
          int bands = 24;
          int band_h = it.get_height() / bands + 1;
          for (int i = 0; i < bands; i++) {
            float t = (float) i / (bands - 1);
            Color band_color((uint8_t) (r1 + (r2 - r1) * t), (uint8_t) (g1 + (g2 - g1) * t), (uint8_t) (b1 + (b2 - b1) * t));
            it.filled_rectangle(0, i * band_h, it.get_width(), band_h, band_color);
          }
          switch (id(weather_icon_index)) {
            case 0: it.image(95, 130, id(weather_icon_01d), ImageAlign::CENTER); break;
            case 1: it.image(95, 130, id(weather_icon_01n), ImageAlign::CENTER); break;
            case 2: it.image(95, 130, id(weather_icon_02d), ImageAlign::CENTER); break;
            case 3: it.image(95, 130, id(weather_icon_03d), ImageAlign::CENTER); break;
            case 4: it.image(95, 130, id(weather_icon_04d), ImageAlign::CENTER); break;
            case 5: it.image(95, 130, id(weather_icon_09d), ImageAlign::CENTER); break;
            case 6: it.image(95, 130, id(weather_icon_10d), ImageAlign::CENTER); break;
            case 7: it.image(95, 130, id(weather_icon_11d), ImageAlign::CENTER); break;
            case 8: it.image(95, 130, id(weather_icon_13d), ImageAlign::CENTER); break;
            default: it.image(95, 130, id(weather_icon_50d), ImageAlign::CENTER); break;
          }
          // Dark backgrounds (clear night, storm) get light text; everything
          // else gets dark text, same logic Alexa Show-style cards use.
          Color text_color = (id(weather_icon_index) == 1 || id(weather_icon_index) == 7) ? Color::WHITE : Color::BLACK;
          it.printf(305, 75, id(font_weather_temp), text_color, TextAlign::TOP_RIGHT, "%s", id(weather_temp_text).c_str());
          it.printf(305, 150, id(font_weather_condition), text_color, TextAlign::TOP_RIGHT, "%s", id(weather_condition_text).c_str());
      - id: now_playing_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(now_playing_image), ImageAlign::CENTER);
# The stock draw_display script only knows about the normal voice-assistant
# phases — it has no idea a snapshot, weather icon, or now-playing art is
# being shown. Anything that calls draw_display (wifi reconnects, api
# reconnects, timer ticks, voice assistant idle/mute updates — the package
# calls draw_display from all of these) would otherwise silently overwrite
# our custom pages. `!extend` appends this check to the END of the existing
# draw_display logic, so it always gets the last word:
#   1. A one-shot snapshot (doorbell/camera) always wins outright — it's
#      already time-boxed by its own delay, so nothing else should
#      interrupt it.
#   2. Otherwise, a weather icon (also one-shot, instant since it's baked
#      into firmware) wins the same way.
#   3. Otherwise, if now-playing art is active AND we're back to the plain
#      idle phase (i.e. no real voice interaction is using the screen right
#      now), show the album art instead of the default idle illustration.
#      Listening/thinking/replying/muted/etc. pages are left completely
#      alone, so talking to the box still looks and behaves normally —
#      the art just resumes the moment the interaction ends.
script:
  - id: !extend draw_display
    then:
      - if:
          condition:
            lambda: return id(showing_snapshot);
          then:
            - lambda: |-
                id(s3_box_lcd).show_page(snapshot_page);
                id(s3_box_lcd).update();
          else:
            - if:
                condition:
                  lambda: return id(showing_weather);
                then:
                  - lambda: |-
                      id(s3_box_lcd).show_page(weather_page);
                      id(s3_box_lcd).update();
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(showing_now_playing) && id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
                      then:
                        - lambda: |-
                            id(s3_box_lcd).show_page(now_playing_page);
                            id(s3_box_lcd).update();
