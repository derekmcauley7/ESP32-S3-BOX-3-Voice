# The blinds report open/closed/opening/closing, not on/off.
text_sensor:
  # entity_picture is a signed, relative path that changes with every track.
  - platform: homeassistant
    id: media_art
    entity_id: ${media_entity}
    attribute: entity_picture
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - online_image.set_url:
                id: album_art
                # entity_picture is sometimes a relative HA path
                # (/api/media_player_proxy/...) and sometimes an absolute URL
                # to a different host entirely -- Music Assistant serves art
                # from its own image proxy. Only prefix the relative kind.
                url: !lambda |-
                  if (x.rfind("http://", 0) == 0 || x.rfind("https://", 0) == 0)
                    return x;
                  return std::string("${ha_url}") + x;
            - lvgl.label.update:
                id: art_placeholder
                text: ""

  - platform: homeassistant
    id: media_title_src
    entity_id: ${media_entity}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: media_title
          text: !lambda 'return x.empty() ? std::string("Nothing playing") : x;'

  - platform: homeassistant
    id: media_artist_src
    entity_id: ${media_entity}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: media_artist
          text: !lambda 'return x;'

  # The entity state itself: playing / paused / idle / off.
  - platform: homeassistant
    id: media_state
    entity_id: ${media_entity}
    on_value:
      - lvgl.label.update:
          id: play_glyph
          text: !lambda 'return x == "playing" ? std::string("${pause_icon}") : std::string("${play_icon}");'
  - platform: homeassistant
    id: ctl2_state
    entity_id: ${ctl2_entity}
    on_value:
      - lvgl.widget.update:
          id: ctl2_tile
          bg_color: !lambda 'return (x == "open" || x == "opening") ? lv_color_hex(${col_tile_on}) : lv_color_hex(${col_tile});'
      - lvgl.label.update:
          id: ctl2_ic
          text_color: !lambda 'return (x == "open" || x == "opening") ? lv_color_hex(${col_text_on}) : lv_color_hex(${col_text});'
      - lvgl.label.update:
          id: ctl2_tx
          text_color: !lambda 'return (x == "open" || x == "opening") ? lv_color_hex(${col_text_on}) : lv_color_hex(${col_text});'

# =============================================================================
# Clock
# =============================================================================
script:
  - id: open_media
    then:
      - lvgl.page.show: media_page

  # mode: restart means a drag full of value events collapses into one call --
  # each new event cancels the pending send and starts the wait again.
  - id: send_volume
    mode: restart
    then:
      - delay: 400ms
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${media_entity}
          data_template:
            volume_level: !lambda |-
              char b[8];
              snprintf(b, sizeof(b), "%.2f", id(vol_pending));
              return std::string(b);
      # Keep ignoring incoming volume updates until HA has echoed this one back.
      - delay: 800ms
      - globals.set:
          id: vol_dragging
          value: 'false'

  - id: open_voice
    then:
      - lvgl.page.show: voice_page
      - voice_assistant.start:

  - id: close_voice
    then:
      - voice_assistant.stop:
      - lvgl.page.show: controls_page

  # Tapping ASK AGAIN mid-answer should interrupt, not be ignored, so stop an
  # in-flight pipeline first -- start() on a running assistant does nothing.
  - id: ask_again
    then:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
            - delay: 300ms
      - voice_assistant.start:

globals:
  - id: vol_dragging
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: vol_pending
    type: float
    restore_value: false
    initial_value: '0.0f'

  - id: dimmed
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: booted
    type: bool
    restore_value: false
    initial_value: 'false'

interval:
  # Boot screen. Runs until everything the UI depends on is actually up, then
  # hands over once. The flag stops it dragging you back to page 1 later.
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return !id(booted);'
          then:
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - lvgl.label.update:
                      id: boot_status
                      text: "Connecting to Wi-Fi..."
                else:
                  - if:
                      condition:
                        not:
                          api.connected:
                      then:
                        - lvgl.label.update:
                            id: boot_status
                            text: "Waiting for Home Assistant..."
                      else:
                        - lvgl.label.update:
                            id: boot_status
                            text: "Ready"
                        - globals.set:
                            id: booted
                            value: 'true'
                        - delay: 600ms
                        - lvgl.page.show: controls_page

  - interval: 1s
    then:
      # Clock, on both status bars
      - lvgl.label.update:
          id: time_p1
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[8]; snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
      - lvgl.label.update:
          id: time_p2
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[8]; snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
# =============================================================================
# Now playing
# =============================================================================
http_request:
  id: http_client
  timeout: 5s
  verify_ssl: false

# Album art. The URL is a placeholder -- the real one arrives from Home
# Assistant as the entity_picture attribute and is set at runtime below.
# JPEG because that is what HA's media_player_proxy serves; switch to PNG if
# your source sends PNG artwork and the log complains about the format.
online_image:
  - id: album_art
    url: "${ha_url}"
    format: JPEG
    type: RGB565
    resize: 260x260
    buffer_size: 32768
    # LVGL calls lv_image_set_src() ONCE when the widget is built and sizes the
    # widget from whatever the descriptor said at that moment -- which, for an
    # image that has not downloaded yet, is nothing. Re-issuing src after every
    # download is what actually puts pixels on screen. Exactly the same trap as
    # the camera feed.
    on_download_finished:
      - lvgl.image.update:
          id: art_img
          src: album_art
      - lvgl.label.update:
          id: art_placeholder
          text: ""
    on_error:
      - lvgl.label.update:
          id: art_placeholder
          text: "${media_icon}"

# =============================================================================
# Audio + Assist (push to talk, answer printed on screen)
# =============================================================================
# No speaker is configured, so nothing is played back -- on_tts_start still
# carries the assistant's reply as text, which is all we need.
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

# The ES8311 sits on the same I2C bus as the touch controller (GPIO7/8).
#
# use_microphone is badly named: it does NOT mean "enable the mic", it means
# "the mic is a PDM DIGITAL one". In the driver it sets bit 6 of REG14, the
# DMIC_ENABLE bit. This board has an ANALOG mic (MSM381) into the codec's ADC,
# which the base register value enables anyway -- so setting it true routes the
# ADC to a digital input with nothing wired to it and you capture pure silence.
# Whisper then hallucinates "Thank you" out of the silence and Assist replies
# "You're welcome", which is a memorable way to spend an evening.
audio_dac:
  - platform: es8311
    id: es8311_codec
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false   # analog mic -- see above. true = PDM.
    mic_gain: 42DB          # analog MSM381 mic; drop to 30DB if it clips

microphone:
  - platform: i2s_audio
    id: panel_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO48
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left           # ES8311 is mono; try "right" if you get silence

voice_assistant:
  id: assist
  microphone:
    microphone: panel_mic
  # No wake word: the pipeline only runs while you are looking at the screen,
  # so nothing competes with the MJPEG decode for CPU.
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_listening:
    - lvgl.label.update: {id: voice_state, text: "Listening..."}
    - lvgl.label.update: {id: voice_stt, text: ""}
    - lvgl.label.update: {id: voice_reply, text: ""}
  on_stt_end:
    - lvgl.label.update: {id: voice_state, text: "Thinking..."}
    - lvgl.label.update:
        id: voice_stt
        text: !lambda 'return x;'
  on_tts_start:
    - lvgl.label.update:
        id: voice_reply
        text: !lambda 'return x;'
  on_end:
    - lvgl.label.update: {id: voice_state, text: "Tap to speak"}
  on_error:
    - lvgl.label.update:
        id: voice_state
        text: !lambda 'return message;'

# =============================================================================
# Icon font
# =============================================================================
# Every icon used above appears here too -- both read the same substitution,
# so changing one at the top changes both.
font:
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mic_font
    size: 96
    bpp: 4
    glyphs:
      - ${mic_icon}
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: transport_font
    size: 52
    bpp: 4
    glyphs:
      - ${prev_icon}
      - ${next_icon}
      - ${play_icon}
      - ${pause_icon}
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: art_font
    size: 110
    bpp: 4
    glyphs:
      - ${media_icon}
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_font
    size: ${icon_size}
    bpp: 4
    glyphs:
      - ${ctl1_icon}
      - ${ctl2_icon}
      - ${ctl3_icon}
      - ${ctl4_icon}
      - ${ctl5_icon}
      - ${ctl6_icon}
      - ${ctl7_icon}
      - ${ctl8_icon}
      - ${media_icon}
      - ${ha_icon}
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: ha_font
    size: 150
    bpp: 4
    glyphs:
      - ${ha_icon}
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: status_font
    size: 26
    bpp: 4
    glyphs:
      - ${wifi_icon}

# =============================================================================
# UI
# =============================================================================
lvgl:
  id: main_lvgl
  on_idle:
    timeout: ${dim_after}
    then:
      - globals.set:
          id: dimmed
          value: 'true'
      - light.turn_on:
          id: display_backlight
          brightness: ${bright_idle}
  displays: panel_display
  touchscreens: panel_touch
  buffer_size: 100%
  byte_order: little_endian
  # 480x800 panel driven as 800x480. Use 270 if it comes up upside down.
  rotation: 90
  bg_color: ${col_bg}

  style_definitions:
    - id: tile_style
      bg_opa: cover
      border_width: 0
      radius: 16
      pad_all: 16
      text_color: ${col_text}

  pages:
    # Declared first, so this is what LVGL shows the moment the display is up.
    # skip: true keeps it out of the swipe rotation once we have left it.
    - id: boot_page
      skip: true
      bg_color: ${col_bg}
      bg_opa: cover
      scrollbar_mode: "off"
      widgets:
        - label:
            align: center
            y: -80
            text_font: ha_font
            text_color: ${col_ha}
            text: "${ha_icon}"

        - label:
            align: center
            y: 60
            text_font: montserrat_28
            text_color: ${col_text}
            text: "${friendly_name}"

        - spinner:
            align: center
            y: 130
            width: 42
            height: 42
            spin_time: 1s
            arc_length: 60deg
            arc_color: ${col_tile}
            arc_width: 5
            indicator:
              arc_color: ${col_tile_on}
              arc_width: 5

        - label:
            id: boot_status
            align: center
            y: 190
            text_font: montserrat_20
            text_color: ${col_dim}
            text: "Starting..."

    - id: controls_page
      bg_color: ${col_bg}
      bg_opa: cover
      scrollbar_mode: "off"
      pad_all: 12
      # Swipe either way to reach the other page.
      # lv_indev_wait_release() stops LVGL delivering anything else
      # from this touch, so the tile underneath never gets its click.
      on_swipe_left:
        - lambda: "lv_indev_wait_release(lv_indev_active());"
        - lvgl.page.show: controls2_page
      on_swipe_right:
        - lambda: "lv_indev_wait_release(lv_indev_active());"
        - lvgl.page.show: controls2_page
      layout:
        type: grid
        grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
        # status bar, two rows of tiles, page switcher
        grid_rows: [30, FR(1), FR(1), 54]
        pad_row: 10
        pad_column: 10
      widgets:
        - obj:
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_column_span: 6
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            bg_opa: transp
            border_width: 0
            pad_all: 0
            clickable: false
            widgets:
              - label:
                  id: temp_p1
                  align: left_mid
                  text_font: ${bar_font}
                  text_color: ${col_text}
                  text: "--°"
              - label:
                  id: time_p1
                  align: center
                  text_font: ${bar_font}
                  text_color: ${col_text}
                  text: "--:--"
              - label:
                  align: right_mid
                  text_font: status_font
                  text_color: ${col_text}
                  text: "${wifi_icon}"
        - button:
            id: ctl1_tile
            styles: tile_style
            bg_color: ${col_tile}
            grid_cell_column_pos: 0
            grid_cell_column_span: 2
            grid_cell_row_pos: 1
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            gesture_bubble: true
            widgets:
              - label:
                  id: ctl1_ic
                  align: top_left
                  text_font: icon_font
                  text_color: ${col_text}
                  text: "${ctl1_icon}"
              - label:
                  id: ctl1_tx
                  align: bottom_left
                  width: 100%
                  long_mode: dot
                  text_font: ${label_font}
                  text_color: ${col_text}
                  text: "${ctl1_label}"
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${ctl1_entity}
        - button:
            id: ctl2_tile
