      bg_opa: cover
      scrollbar_mode: "off"
      pad_all: 12
      # Swipe either way to reach the other page.
      # lv_indev_wait_release() stops LVGL delivering anything else
      # from this touch, so the tile underneath never gets its click.
      on_swipe_left:
        - lambda: "lv_indev_wait_release(lv_indev_active());"
        - lvgl.page.show: cameras_page
      on_swipe_right:
        - lambda: "lv_indev_wait_release(lv_indev_active());"
