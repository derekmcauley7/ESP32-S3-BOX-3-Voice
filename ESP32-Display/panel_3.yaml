                  text_color: ${col_dim}
                  text: "${page2_name}"
            on_click:
              - lvgl.page.show: cameras_page

    - id: cameras_page
      bg_color: ${col_bg}
      bg_opa: cover
      scrollbar_mode: "off"
      pad_all: 12
      # Swipe either way to reach the other page.
