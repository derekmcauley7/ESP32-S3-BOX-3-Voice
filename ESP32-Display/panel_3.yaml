        - label:
            align: center
            y: -80
            text_font: ha_font
            text_color: ${col_ha}
            text: "${ha_icon}"

        - label:
            align: center
            y: 60
            text_font: montserrat_28
            text_color: ${col_text}
            text: "${friendly_name}"

        - spinner:
            align: center
            y: 130
            width: 42
            height: 42
            spin_time: 1s
            arc_length: 60deg
            arc_color: ${col_tile}
            arc_width: 5
            indicator:
              arc_color: ${col_tile_on}
              arc_width: 5

        - label:
            id: boot_status
            align: center
            y: 190
            text_font: montserrat_20
            text_color: ${col_dim}
            text: "Starting..."

    - id: controls_page
