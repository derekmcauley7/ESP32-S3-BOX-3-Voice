    # Live video. skip: true keeps it out of the swipe rotation.
    - id: camera_page
      skip: true
      bg_color: "0x000000"
      bg_opa: cover
      scrollbar_mode: "off"
      widgets:
        # Declared first so the controls below paint on top of it.
        - image:
            id: cam_img
            src: live_cams
            x: 0
            y: 15
            width: 800
            height: 450

        - label:
            id: cam_title
            x: 14
            y: 10
            text_font: montserrat_22
            text_color: ${col_text}
            text: "Camera"

        - button:
            id: cam_back
            x: 676
            y: 8
            width: 110
            height: 46
            bg_color: ${col_tile}
            bg_opa: cover
            radius: 12
            border_width: 0
            widgets:
              - label:
                  align: center
                  text_color: ${col_text}
                  text_font: montserrat_20
                  text: "BACK"
            on_click:
              - script.execute: close_camera

        - label:
            id: cam_status
            x: 14
            y: 452
            text_font: montserrat_18
            text_color: ${col_text}
            text: "Idle"

        - label:
            id: cam_fps
            x: 682
            y: 452
            text_font: montserrat_18
            text_color: ${col_text}
            text: "-- FPS"

    # Now playing. skip: true keeps it out of the swipe rotation.
    - id: media_page
      skip: true
      bg_color: ${col_bg}
      bg_opa: cover
      scrollbar_mode: "off"
      widgets:
        # Art sits on a tile-coloured square so an empty slot still looks
        # intentional; the placeholder glyph shows through until art arrives.
        - obj:
            x: 40
            y: 60
            width: 260
            height: 260
            bg_color: ${col_tile}
            bg_opa: cover
            radius: 16
            border_width: 0
            pad_all: 0
