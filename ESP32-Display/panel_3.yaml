        - slider:
            id: vol_slider
            x: 336
            y: 280
            width: 424
            height: 18
            min_value: 0
            max_value: 100
            indicator:
              bg_color: ${col_tile_on}
            knob:
              bg_color: ${col_text}
            # x is the slider's new value, handed straight to the trigger --
            # no need to reach into the LVGL object, whose type is opaque here.
            on_value:
              - globals.set:
                  id: vol_dragging
                  value: 'true'
              - lambda: 'id(vol_pending) = x / 100.0f;'
              - script.execute: send_volume

        - button:
            x: 676
            y: 414
            width: 110
            height: 46
            bg_color: ${col_tile}
            bg_opa: cover
            radius: 12
            border_width: 0
